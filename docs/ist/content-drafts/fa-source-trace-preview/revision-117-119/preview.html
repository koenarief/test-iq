<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>Preview trace FA 117–119</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px; background: #f3f4f6; color: #111827; font-family: Arial, sans-serif; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { margin: 0 0 26px; color: #4b5563; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .card { background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 16px; }
        .card h2 { margin: 0 0 10px; font-size: 20px; }
        .frame { border: 2px solid #4b5563; background: white; }
        img { display: block; width: 100%; height: auto; }
        .status { margin-top: 10px; font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>
    <h1>Kandidat trace FA 117–119</h1>
    <p>Preview sebelum dipasang ke staging atau database.</p>
    <div class="grid">
        <article class="card"><h2>Sumber 117</h2><div class="frame"><img src="fa-117-candidate.svg"></div><div class="status">candidate · belum aktif</div></article>
        <article class="card"><h2>Sumber 118</h2><div class="frame"><img src="fa-118-candidate.svg"></div><div class="status">candidate · belum aktif</div></article>
        <article class="card"><h2>Sumber 119</h2><div class="frame"><img src="fa-119-candidate.svg"></div><div class="status">candidate · belum aktif</div></article>
    </div>
</body>
</html>
